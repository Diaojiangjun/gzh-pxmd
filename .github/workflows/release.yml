name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: pack:win
            files: "release/*.exe"
          - os: macos-latest
            script: pack:mac
            files: |
              release/*.dmg
              release/*.zip
          - os: ubuntu-latest
            script: pack:linux
            files: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build renderer & main process
        run: npm run electron:build

      - name: Package (${{ matrix.script }})
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: Upload assets to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}