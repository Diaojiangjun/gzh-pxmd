<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>宝藏排版器 - 微信公众号排版工具</title>
    <meta name="description" content="基于 Electron 与 gzh-design-skill 的跨平台微信公众号 Markdown 排版工具，内置多篇本地文章管理、版本时光机历史快照与回滚、6套专业排版主题、表情包管理、手机样机预览与公众号富文本一键复制。" />
    <meta property="og:title" content="宝藏排版器 - 微信公众号排版工具" />
    <meta property="og:description" content="基于 Electron 与 gzh-design-skill 的跨平台微信公众号 Markdown 排版工具，内置多篇本地文章管理、版本时光机历史快照与回滚、6套专业排版主题、表情包管理、手机样机预览与公众号富文本一键复制。" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>

    <!--
      首屏骨架屏

      React 挂载前窗口是纯白的，开发模式下尤其明显（实测冷启动：vite 首次编译依赖 +
      61 个模块请求，空窗可达数秒）。这里放一个与最终布局同构的骨架，
      把「什么都没有」变成「正在加载」。

      两个约束：
      - 样式必须内联 —— 此时应用 CSS 还没加载，引用不到任何类名；
      - 不能用内联 <script> 移除 —— 构建产物有 CSP `script-src 'self'`。
        移除逻辑放在 src/main.tsx，用 MutationObserver 等 React 真正挂载完再撤。
    -->
    <div id="boot-skeleton" aria-hidden="true">
      <style>
        @keyframes boot-shimmer {
          0% { background-position: -420px 0; }
          100% { background-position: 420px 0; }
        }
        @keyframes boot-fade-up {
          from { opacity: 0; transform: translate(-50%, 6px); }
          to { opacity: 1; transform: translate(-50%, 0); }
        }
        @keyframes boot-spin { to { transform: rotate(360deg); } }
        #boot-skeleton {
          position: fixed; inset: 0; z-index: 9999;
          display: flex; flex-direction: column;
          background: #f8fafc; color: #64748b;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        #boot-skeleton .bs-bar {
          height: 52px; flex-shrink: 0; display: flex; align-items: center; gap: 12px;
          padding: 0 18px; background: #ffffff; border-bottom: 1px solid #e2e8f0;
        }
        #boot-skeleton .bs-logo {
          width: 22px; height: 22px; border-radius: 7px;
          background: linear-gradient(135deg, #07c160, #34d399);
        }
        #boot-skeleton .bs-title { font-size: 13px; font-weight: 700; color: #2c3e50; }
        #boot-skeleton .bs-chip { height: 24px; padding: 0 10px; border-radius: 6px; background: #f1f5f9; border: 1px solid #e2e8f0; }
        #boot-skeleton .bs-body { flex: 1; display: flex; min-height: 0; }
        #boot-skeleton .bs-rail {
          width: 56px; flex-shrink: 0; background: #ffffff; border-right: 1px solid #e2e8f0;
          padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 14px;
        }
        #boot-skeleton .bs-dot { width: 26px; height: 26px; border-radius: 8px; background: #eef2f7; }
        #boot-skeleton .bs-main { flex: 1; display: flex; min-width: 0; }
        #boot-skeleton .bs-col { flex: 1; min-width: 0; padding: 18px; }
        #boot-skeleton .bs-col + .bs-col { border-left: 1px solid #e2e8f0; background: #f1f5f9; }
        #boot-skeleton .bs-line {
          height: 11px; border-radius: 6px; margin-bottom: 13px;
          background: linear-gradient(90deg, #eef2f7 0%, #f8fafc 50%, #eef2f7 100%);
          background-size: 420px 100%;
          animation: boot-shimmer 1.15s linear infinite;
        }
        #boot-skeleton .bs-line.w40 { width: 40%; }
        #boot-skeleton .bs-line.w60 { width: 60%; }
        #boot-skeleton .bs-line.w80 { width: 80%; }
        #boot-skeleton .bs-card { height: 84px; border-radius: 10px; margin-bottom: 13px; background: #ffffff; border: 1px solid #e8edf3; }
        #boot-skeleton .bs-status {
          position: fixed; left: 50%; bottom: 42px;
          display: flex; align-items: center; gap: 9px;
          padding: 9px 16px; border-radius: 999px;
          background: rgba(255, 255, 255, 0.94); border: 1px solid #e2e8f0;
          box-shadow: 0 6px 20px rgba(15, 23, 42, 0.08);
          font-size: 12px; color: #475569;
          animation: boot-fade-up 0.3s ease-out;
        }
        #boot-skeleton .bs-spinner {
          width: 13px; height: 13px; border-radius: 50%;
          border: 2px solid #cbd5e1; border-top-color: #07c160;
          animation: boot-spin 0.7s linear infinite;
        }
        @media (prefers-reduced-motion: reduce) {
          #boot-skeleton .bs-line, #boot-skeleton .bs-spinner { animation: none; }
        }
      </style>

      <div class="bs-bar">
        <div class="bs-logo"></div>
        <div class="bs-title">宝藏排版器 Pro</div>
        <div class="bs-chip"></div>
        <div class="bs-chip"></div>
      </div>

      <div class="bs-body">
        <div class="bs-rail">
          <div class="bs-dot"></div><div class="bs-dot"></div><div class="bs-dot"></div>
          <div class="bs-dot"></div><div class="bs-dot"></div><div class="bs-dot"></div>
        </div>
        <div class="bs-main">
          <div class="bs-col">
            <div class="bs-line w40"></div>
            <div class="bs-line"></div>
            <div class="bs-line w80"></div>
            <div class="bs-line w60"></div>
            <div class="bs-line"></div>
          </div>
          <div class="bs-col">
            <div class="bs-line w60"></div>
            <div class="bs-card"></div>
            <div class="bs-card"></div>
            <div class="bs-line w40"></div>
          </div>
        </div>
      </div>

      <div class="bs-status">
        <div class="bs-spinner"></div>
        <span>正在启动编辑器…</span>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
